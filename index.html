<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Fidelidade - Designer Estilo Mary</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #0A0A0A;
            color: #FFFFFF;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card-container {
            width: 100%;
            max-width: 450px;
            background: linear-gradient(135deg, #14161d 0%, #0d0f14 100%);
            border-radius: 20px;
            padding: 24px;
            border: 2px solid #D4AF37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
            text-align: center;
        }
        h1 { color: #FFD700; font-size: 22px; margin-bottom: 6px; font-weight: 800; }
        p.subtitle { color: #a0a6b8; font-size: 13px; margin-bottom: 20px; }
        
        .client-info-box {
            background: #1a1d26;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #2a2e3d;
            text-align: left;
        }
        .client-info-box div { font-size: 13px; margin-bottom: 4px; color: #d0d5e2; }
        .client-info-box span { color: #FFD700; font-weight: bold; }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stamp-slot {
            aspect-ratio: 1;
            background: #101217;
            border: 2px dashed #3a3f52;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            color: #4a5166;
            transition: all 0.3s ease;
        }
        .stamp-slot.filled {
            background: radial-gradient(circle, #FFE58F 0%, #D4AF37 100%);
            border: 2px solid #FFD700;
            color: #0A0A0A;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        .info-card-footer {
            background: #1a1d26;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            color: #00d2d3;
            font-weight: 600;
            margin-bottom: 20px;
            border: 1px solid #232733;
        }

        .btn-admin-link {
            display: inline-block;
            background: #1a1d26;
            color: #FFD700;
            border: 1px solid #D4AF37;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-admin-link:hover {
            background: #2a2e3d;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>✨ Designer Estilo Mary</h1>
        <p class="subtitle">Cartão Fidelidade Digital</p>

        <div class="client-info-box" id="clientBox">
            <div>Cliente: <span id="clientName">Carregando...</span></div>
            <div>ID: <span id="clientId">--</span></div>
            <div>Pontos Atuais: <span id="clientPoints">0</span> pts</div>
        </div>

        <!-- Grade de Carimbos (10 espaços) -->
        <div class="stamps-grid" id="stampsGrid">
            <!-- Gerado via JavaScript -->
        </div>

        <div class="info-card-footer" id="cardValidity">
            📅 Validade do ciclo: Carregando...
        </div>

        <a href="admin.html" class="btn-admin-link">🔒 Acessar Painel Administrativo</a>
    </div>

    <script>
        // Simulação de carregamento do cliente logado no dispositivo ou via URL
        function loadClientCard() {
            let saved = localStorage.getItem('mary_clients_list');
            let clients = saved ? JSON.parse(saved) : [];
            
            // Pega o primeiro cliente como exemplo padrão de visualização do cartão
            let client = clients.length > 0 ? clients[0] : { name: "Cliente Exemplo", id: "EB-1001", points: 3, lastUpdate: "2026-11-01", days: 60 };

            document.getElementById('clientName').innerText = client.name;
            document.getElementById('clientId').innerText = client.id;
            document.getElementById('clientPoints').innerText = client.points;

            // Renderiza os carimbos (meta de 10 pontos)
            const grid = document.getElementById('stampsGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                const slot = document.createElement('div');
                slot.className = `stamp-slot ${i <= client.points ? 'filled' : ''}`;
                slot.innerText = i <= client.points ? '⭐' : i;
                grid.appendChild(slot);
            }

            // Calcula a validade baseada no início fixo do ciclo
            let updateDate = new Date((client.lastUpdate || '2026-11-01') + 'T00:00:00');
            let expiryDate = new Date(updateDate.getTime());
            expiryDate.setDate(expiryDate.getDate() + (client.days || 60));

            document.getElementById('cardValidity').innerText = `📅 Válido até: ${expiryDate.toLocaleDateString('pt-BR')}`;
        }

        loadClientCard();
    </script>
</body>
</html>
