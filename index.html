<script>
        function formatDate(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}`;
        }

        function formatFullDate(dateObj) {
            const day = String(dateObj.getDate()).padStart(2, '0');
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const year = dateObj.getFullYear();
            return `${day}/${month}/${year}`;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const clientName = urlParams.get('nome') || 'Cliente';
        const clientId = urlParams.get('id') || 'EB-1001';
        const points = parseInt(urlParams.get('pontos')) || 0;
        const validityDays = parseInt(urlParams.get('dias')) || 60;
        
        // Pega a data fixa passada pelo painel admin ou usa a de hoje se não houver
        const dateParam = urlParams.get('data');
        const updateDate = dateParam ? new Date(dateParam) : new Date();

        document.getElementById('clientGreeting').innerText = `Olá, ${clientName}! 👋`;
        document.getElementById('pointsDisplay').innerText = `${points} pontos 💖`;
        document.getElementById('totalPointsText').innerText = `${points} PTS`;
        document.getElementById('validityDaysText').innerText = validityDays;

        // Calcula a validade somando os 60 dias em cima da data fixa do atendimento
        const expiryDate = new Date(updateDate.getTime() + (validityDays * 24 * 60 * 60 * 1000));
        document.getElementById('datesDisplay').innerText = `Atualizado em ${formatFullDate(updateDate)} - Válido até ${formatFullDate(expiryDate)}`;

        if (points > 0) {
            document.getElementById('recentActivityText').innerText = `Você ganhou pontos em ${formatDate(updateDate)} 🎉`;
        }

        // Configuração do botão de Agendamento (WhatsApp da Mariana)
        const correctPhone = "5511967066029";
        const scheduleMsg = encodeURIComponent(`Olá Mariana! Vim pelo meu Cartão Fidelidade (${clientId}) e gostaria de agendar meu horário no estúdio.`);
        document.getElementById('whatsappBtn').href = `https://api.whatsapp.com/send?phone=${correctPhone}&text=${scheduleMsg}`;

        // Renderizar os 10 selos com o histórico detalhado
        const grid = document.getElementById('stampsGrid');
        let historyEntries = [];
        let ptsLeft = points;

        while (ptsLeft > 0) {
            let chunk = ptsLeft >= 5 ? 5 : (ptsLeft >= 3 ? 3 : ptsLeft);
            historyEntries.push({
                val: `+${chunk}`,
                date: formatDate(updateDate)
            });
            ptsLeft -= chunk;
        }

        for (let i = 1; i <= 10; i++) {
            const stamp = document.createElement('div');
            
            if (i <= historyEntries.length) {
                stamp.className = 'stamp filled';
                stamp.innerHTML = `
                    <div class="stamp-value">${historyEntries[i-1].val}</div>
                    <div class="stamp-label">❤️ Atend.</div>
                    <div class="stamp-date">${historyEntries[i-1].date}</div>
                `;
            } else {
                stamp.className = 'stamp empty';
                stamp.innerHTML = i;
            }
            grid.appendChild(stamp);
        }

        // Função de Indicação corrigida para abrir a tela de compartilhamento com a amiga
        function shareReferral() {
            const currentUrl = window.location.href.split('?')[0];
            const refLink = `${currentUrl}?ref=${clientId}`;
            const shareText = encodeURIComponent(`Olá! Conheça o Designer Estilo Mary e faça seu Cartão Fidelidade digital! Use meu link de indicação para começar: ${refLink}`);
            
            const waShareUrl = `https://api.whatsapp.com/send?text=${shareText}`;
            window.open(waShareUrl, '_blank');
        }
    </script>
