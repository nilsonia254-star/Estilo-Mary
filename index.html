<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Fidelidade - Designer Estilo Mary</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        
        body {
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 60%),
                linear-gradient(135deg, #0d0e12 0%, #050507 100%);
            color: #FFFFFF;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-container {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(145deg, #13151c 0%, #090a0e 100%);
            border-radius: 24px;
            padding: 24px;
            border: 2px solid #D4AF37;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.25);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            pointer-events: none;
        }

        .header-symbols {
            font-size: 20px;
            letter-spacing: 8px;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 5px rgba(212, 175, 55, 0.5));
        }

        h1 { 
            font-family: 'Cinzel', serif;
            color: #FFD700; 
            font-size: 22px; 
            margin-bottom: 4px; 
            font-weight: 700; 
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        p.subtitle { 
            color: #a0a6b8; 
            font-size: 11px; 
            margin-bottom: 16px; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .client-info-box {
            background: rgba(20, 23, 31, 0.9);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            text-align: left;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        .client-info-box div { font-size: 12px; margin-bottom: 3px; color: #b3b9c5; }
        .client-info-box span { color: #FFD700; font-weight: 600; }

        .reward-counter {
            background: linear-gradient(135deg, #2a2215 0%, #15120c 100%);
            border: 1px solid #D4AF37;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .reward-counter span {
            font-family: 'Cinzel', serif;
            font-size: 16px;
            font-weight: 700;
            color: #FFE58F;
        }
        .reward-icon {
            font-size: 18px;
        }

        .stamps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 18px;
        }
        
        .stamp-slot {
            aspect-ratio: 1;
            background: linear-gradient(145deg, #181b24, #0d0f14);
            border: 2px solid #2e3445;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 700;
            color: #6c758d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 2px rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .stamp-slot.filled {
            background: radial-gradient(circle, #ffe999 0%, #D4AF37 70%, #aa820a 100%);
            border: 2px solid #FFF2B2;
            color: #0A0A0A;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.6), inset 0 2px 4px rgba(255,255,255,0.6);
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
            transform: scale(1.03);
        }

        .info-card-footer {
            background: rgba(18, 20, 27, 0.8);
            border-radius: 10px;
            padding: 10px;
            font-size: 11px;
            color: #00d2d3;
            font-weight: 600;
            margin-bottom: 16px;
            border: 1px solid rgba(0, 210, 211, 0.2);
        }

        .btn-action-blue {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%);
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .btn-action-blue:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-admin-link {
            display: inline-block;
            background: linear-gradient(135deg, #1c1f2b 0%, #101217 100%);
            color: #FFD700;
            border: 1px solid #D4AF37;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-admin-link:hover {
            background: #2a2e3d;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="header-symbols">✨ 👁️ ✨</div>
        <h1>Designer Estilo Mary</h1>
        <p class="subtitle">Cartão Fidelidade Digital</p>

        <div class="client-info-box" id="clientBox">
            <div>Cliente: <span id="clientName">Carregando...</span></div>
            <div>ID: <span id="clientId">--</span></div>
        </div>

        <div class="reward-counter">
            <span class="reward-icon">💎</span>
            <span id="clientPointsDisplay">0 pontos</span>
        </div>

        <!-- Grade de 12 Espaços/Botões Metálicos -->
        <div class="stamps-grid" id="stampsGrid">
            <!-- Gerado dinamicamente via JavaScript (1 a 12) -->
        </div>

        <div class="info-card-footer" id="cardValidity">
            📅 Validade do ciclo: Carregando...
        </div>

        <a href="#" onclick="alert('Cartão oficial do Designer Estilo Mary!'); return false;" class="btn-action-blue">✨ Ver Meus Benefícios</a>

        <a href="admin.html" class="btn-admin-link">🔒 Acessar Painel do Administrador</a>
    </div>

    <script>
        function loadClientCard() {
            let saved = localStorage.getItem('mary_clients_list');
            let clients = saved ? JSON.parse(saved) : [];
            
            let client = clients.length > 0 ? clients[0] : { name: "Cliente Exemplo", id: "EB-1001", points: 3, lastUpdate: "2026-11-01", days: 60 };

            document.getElementById('clientName').innerText = client.name;
            document.getElementById('clientId').innerText = client.id;
            document.getElementById('clientPointsDisplay').innerText = `${client.points} pontos`;

            const grid = document.getElementById('stampsGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const slot = document.createElement('div');
                slot.className = `stamp-slot ${i <= client.points ? 'filled' : ''}`;
                slot.innerText = i <= client.points ? '★' : i;
                grid.appendChild(slot);
            }

            let updateDate = new Date((client.lastUpdate || '2026-11-01') + 'T00:00:00');
            let expiryDate = new Date(updateDate.getTime());
            expiryDate.setDate(expiryDate.getDate() + (client.days || 60));

            document.getElementById('cardValidity').innerText = `📅 Válido até: ${expiryDate.toLocaleDateString('pt-BR')}`;
        }

        loadClientCard();
    </script>
</body>
</html>
