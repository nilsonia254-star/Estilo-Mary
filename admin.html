<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Gestor - Designer Estilo Mary</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #080808;
            color: #ffffff;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .admin-container {
            width: 100%;
            max-width: 500px;
            background: linear-gradient(145deg, #121212, #1a1a1a);
            border: 2px solid #e5c158;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(229, 193, 88, 0.2);
        }
        h1 {
            font-size: 20px;
            color: #ffffff;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #e5c158;
            font-size: 12px;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .section-box {
            background: #161616;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .section-box h3 {
            font-size: 15px;
            color: #e5c158;
            margin-bottom: 12px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cccccc;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            background: #222222;
            border: 1px solid #444444;
            color: #ffffff;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
        .btn-primary {
            background-color: #e5c158;
            color: #080808;
        }
        .btn-copy {
            background-color: #25d366;
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #161616;
            border: 1px solid #333333;
            padding: 12px 8px;
            border-radius: 10px;
        }
        .stat-card span {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #e5c158;
            margin-top: 5px;
        }
        .stat-card p {
            font-size: 11px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Painel do Gestor</h1>
        <p class="subtitle">Espaço da Beleza - Controle de Sistema</p>

        <!-- Indicadores Rápidos -->
        <div class="stats-grid">
            <div class="stat-card">
                <p>Clientes</p>
                <span>1</span>
            </div>
            <div class="stat-card">
                <p>Atendimentos</p>
                <span>1</span>
            </div>
            <div class="stat-card">
                <p>Pts Ativos</p>
                <span>13</span>
            </div>
        </div>

        <!-- Ferramenta de Cópia do Link do Admin -->
        <div class="section-box">
            <h3>🔗 Atalho do Painel</h3>
            <p style="font-size: 12px; color: #aaaaaa; margin-bottom: 10px;">Copie o link desta página para acessar rapidamente no celular:</p>
            <button onclick="copiarLinkAdmin()" class="btn btn-copy">📋 Copiar Link Deste Painel</button>
        </div>

        <!-- Gerenciar Cliente / Lançar Pontos -->
        <div class="section-box">
            <h3>👤 Lançar Pontos & Validade</h3>
            <div class="form-group">
                <label>Nome da Cliente:</label>
                <input type="text" id="nome-cliente" value="Natália Oliveira de Souza">
            </div>
            <div class="form-group">
                <label>WhatsApp (com DDD):</label>
                <input type="text" id="tel-cliente" value="11967066029">
            </div>
            <div class="form-group">
                <label>Adicionar Pontos:</label>
                <select id="qtd-pontos">
                    <option value="1">+1 Ponto</option>
                    <option value="3">+3 Pontos</option>
                    <option value="5" selected>+5 Pontos</option>
                </select>
            </div>
            <button onclick="salvarPontos()" class="btn btn-primary">Salvar e Atualizar Cliente</button>
        </div>
    </div>

    <script>
        function copiarLinkAdmin() {
            const linkAdmin = window.location.href;
            navigator.clipboard.writeText(linkAdmin).then(() => {
                alert("Link do painel copiado com sucesso!");
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
            });
        }

        function salvarPontos() {
            alert("Pontos atualizados com sucesso!");
        }
    </script>

</body>
</html>
