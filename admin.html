<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Designer Estilo Mary</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .admin-container {
            background: #0d0d0d;
            border: 2px solid #e5c158;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 22px;
            box-shadow: 0 10px 35px rgba(229, 193, 88, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #f7e196;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .header p {
            color: #aaaaaa;
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #cccccc;
            margin-bottom: 6px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #141414;
            border: 1px solid #333333;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #e5c158;
        }
        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-quick {
            background: #1f1f1f;
            border: 1px solid #444444;
            color: #f7e196;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-quick:hover {
            background: #332d12;
            border-color: #e5c158;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-whatsapp {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.25);
        }
        .result-box {
            background: #141414;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 14px;
            margin-top: 20px;
            display: none;
        }
        .result-box h3 {
            font-size: 14px;
            color: #f7e196;
            margin-bottom: 8px;
        }
        .result-link {
            font-size: 12px;
            color: #ffffff;
            word-break: break-all;
            background: #050505;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #222222;
            margin-bottom: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header">
            <h1>👑 Painel da Gestão 👑</h1>
            <p>Designer Estilo Mary</p>
        </div>

        <div class="form-group">
            <label for="clientName">Nome da Cliente:</label>
            <input type="text" id="clientName" placeholder="Ex: Natália">
        </div>

        <div class="form-group">
            <label for="clientPoints">Quantidade Total de Pontos:</label>
            <input type="number" id="clientPoints" placeholder="Ex: 5" value="0">
        </div>

        <div class="form-group">
            <label>Adicionar pontos rápido:</label>
            <div class="quick-buttons">
                <button type="button" class="btn-quick" onclick="addPoints(1)">+1 Ponto</button>
                <button type="button" class="btn-quick" onclick="addPoints(3)">+3 Pontos</button>
                <button type="button" class="btn-quick" onclick="addPoints(5)">+5 Pontos</button>
            </div>
        </div>

        <div class="form-group">
            <label for="lastUpdate">Data da Atualização:</label>
            <input type="text" id="lastUpdate" value="31/10/2026">
        </div>

        <button class="btn btn-primary" onclick="generateCardLink()">Gerar Link Personalizado</button>

        <div id="resultSection" class="result-box">
            <h3>Link gerado com sucesso!</h3>
            <span id="generatedLink" class="result-link"></span>
            <a id="whatsappShareBtn" href="#" class="btn btn-whatsapp" target="_blank">📲 Enviar Cartão no WhatsApp</a>
        </div>
    </div>

    <script>
        function addPoints(amount) {
            const pointsInput = document.getElementById('clientPoints');
            let current = parseInt(pointsInput.value) || 0;
            pointsInput.value = current + amount;
        }

        function generateCardLink() {
            const name = document.getElementById('clientName').value.trim() || 'Cliente';
            const points = document.getElementById('clientPoints').value.trim() || '0';
            const date = document.getElementById('lastUpdate').value.trim() || '31/10/2026';

            // Base URL do seu site no GitHub Pages
            const baseUrl = "https://nilsonia254-star.github.io/Estilo-Mary/";

            // Monta o link com os parâmetros da cliente
            const fullLink = `${baseUrl}?nome=${encodeURIComponent(name)}&pontos=${encodeURIComponent(points)}&data=${encodeURIComponent(date)}`;

            // Exibe o resultado na tela
            document.getElementById('generatedLink').innerText = fullLink;
            
            // Mensagem pronta para enviar no WhatsApp da cliente
            const msg = `Olá ${name}! 💖 Seu Cartão Fidelidade no Designer Estilo Mary foi atualizado para ${points} pontos! Acesse aqui: ${fullLink}`;
            document.getElementById('whatsappShareBtn').href = `https://wa.me/?text=${encodeURIComponent(msg)}`;

            document.getElementById('resultSection').style.display = 'block';
        }
    </script>

</body>
</html>
